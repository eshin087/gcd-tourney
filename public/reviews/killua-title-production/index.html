<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Killua idle QA</title><style>body{background:#17202b;color:#edf3ff;font:16px system-ui;margin:24px}canvas{max-width:100%;image-rendering:pixelated;background:#283344}button{padding:10px;margin:8px}p{max-width:850px}</style><h1>Killua idle v05 — working candidate</h1><p>Approved neutral · approved combat · candidate idle. Same pixel scale and floor. This checks whether breathing changes pose or anatomy; it is not art approval or a production release.</p><button id="toggle">Pause</button><button id="step">Step frame</button><span id="frame"></span><br><canvas width="768" height="256"></canvas><script type="module">
const images=await Promise.all(['neutral.png','combat.png','idle-sheet.png'].map(src=>new Promise(resolve=>{const i=new Image;i.onload=()=>resolve(i);i.src=src;})));const m=await(await fetch('idle-anims.json')).json(),c=document.querySelector('canvas'),x=c.getContext('2d');x.imageSmoothingEnabled=false;let f=0,playing=true,last=0;const a=m.animations.idle;document.querySelector('#toggle').onclick=()=>{playing=!playing;document.querySelector('#toggle').textContent=playing?'Pause':'Play';};document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#toggle').textContent='Play';f=(f+1)%a.frames.length;};function draw(t){if(playing&&t-last>=150){f=(f+1)%a.frames.length;last=t;}x.clearRect(0,0,768,256);x.drawImage(images[0],0,0);x.drawImage(images[1],256,0);const n=a.frames[f];x.drawImage(images[2],(n%16)*256,Math.floor(n/16)*256,256,256,512,0,256,256);document.querySelector('#frame').textContent='Frame '+f;requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
