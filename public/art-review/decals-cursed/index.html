<!doctype html><meta name="viewport" content="width=device-width"><title>Cursed decal candidates</title><style>body{font:16px system-ui;background:#17191e;color:#eee;margin:24px}section{border-top:1px solid #666;padding:16px 0}canvas{image-rendering:pixelated;max-width:100%;background:#c8bba4;margin:5px}a{color:#8ed9ff}button{padding:12px;margin:5px}iframe{width:100%;height:650px;border:0}</style><h1>Cursed decals — correction candidates</h1><p>Unapproved. 6 names, 20 variants. Two fresh-source fringe warnings and repel hot-placement failures remain; review caveats before approval.</p><a href="QA.md">Detailed QA</a> · <a href="game.html">In-game groundDemo and rotation check</a><main></main><script type="module">const meta=await(await fetch('./candidate/atlas.json')).json();const imgs=await Promise.all(meta.pages.map(async p=>{const i=new Image();i.src='./candidate/'+p;await i.decode();return i}));const sources={"erasure":["erasure_v02.png"],"erasure_trench":["erasure_trench_v02_A.png","erasure_trench_v02_B.png"],"crush_implode":["crush_implode_v03_A.png","crush_implode_v03_B.png"],"gouge_repel":["gouge_repel_v02_A.png","gouge_repel_v02_B.png"],"fracture_cursed":["fracture_cursed_v03_A.png","fracture_cursed_v03_B.png"],"fracture_cursed_big":["fracture_cursed_big_v02.png"]};const warnings={"erasure":"v02: thinner double rim and restored inner ring. Source symmetry and pixel texture remain imperfect.","erasure_trench":"v02: taller channels, open matching ends; rim thickness differs between parts.","crush_implode":"v03: FAIL source pink 0.6%; 283 packed pink pixels remain. Raised slab facets and outer density need further correction.","gouge_repel":"v02: packed pink removed at tolerance 180; FAIL origin-only hot placement (300 hot pixels beyond left quarter); proportions remain narrow.","fracture_cursed":"v03: straight primary cuts, angular web and flat centers improved. Source pink 0.2% warning remains; packed pink 0. Solid outer boundary caveat.","fracture_cursed_big":"v02: correct 3/4 internal rings and 8/12 rays; longer tips. Solid disc boundary still conspicuous."};for(const [name,e] of Object.entries(meta.decals)){if(e.group!=='cursed')continue;const sec=document.createElement('section');sec.innerHTML='<h2>'+name+' v'+String(e.version).padStart(2,'0')+'</h2><p>'+warnings[name]+'</p><p>Needs review; remaining failures and caveats are listed above.</p>';sec.innerHTML+='<p>'+sources[name].map(f=>'<a href="originals/'+f+'">'+f+'</a>').join(' · ')+'</p>';for(const [x,y]of e.frames){const c=document.createElement('canvas');c.width=e.w;c.height=e.h;c.style.width=(e.w/2)+'px';c.getContext('2d').drawImage(imgs[e.page],x,y,e.w,e.h,0,0,e.w,e.h);sec.append(c)}document.querySelector('main').append(sec)}</script>
