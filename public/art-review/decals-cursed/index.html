<!doctype html><meta name="viewport" content="width=device-width"><title>Cursed decal candidates</title><style>body{font:16px system-ui;background:#17191e;color:#eee;margin:24px}section{border-top:1px solid #666;padding:16px 0}canvas{image-rendering:pixelated;max-width:100%;background:#c8bba4;margin:5px}a{color:#8ed9ff}button{padding:12px;margin:5px}iframe{width:100%;height:650px;border:0}</style><h1>Cursed decals — v01 candidates</h1><p>Unapproved. 6 names, 20 variants. Three pink-fringe warnings remain; review the caveats before approval.</p><a href="game.html">In-game groundDemo and rotation check</a><main></main><script type="module">const meta=await(await fetch('/preview/decals/atlas.json')).json();const img=new Image();img.src='/preview/decals/decals_cursed.png';await img.decode();const warnings={"erasure":"Raw canvas 2172 x 724; packed circles are intact. Rim thickness varies.","erasure_trench":"Raw aspect differs from requested 2:1; packed tiling has no packer warning. End profiles need visual review.","crush_implode":"1.1% pink/purple warning. Some raised slab shading remains; recommend redraw.","gouge_repel":"1.5% pink/purple warning. Fan proportions vary and some edges extend white beyond origin; recommend redraw.","fracture_cursed":"1.0% pink/purple warning; angular cracks and flat center are inconsistent, recommend redraw.","fracture_cursed_big":"No packer warning. Second design has fewer full rings than requested; outside boundary is too solid. Recommend refinement."};for(const [name,e] of Object.entries(meta.decals)){const sec=document.createElement('section');sec.innerHTML='<h2>'+name+' v01</h2><p>'+warnings[name]+'</p><p>Approval command: approve decals '+name+' v01</p>';for(const [x,y]of e.frames){const c=document.createElement('canvas');c.width=e.w;c.height=e.h;c.style.width=(e.w/2)+'px';c.getContext('2d').drawImage(img,x,y,e.w,e.h,0,0,e.w,e.h);sec.append(c)}document.querySelector('main').append(sec)}</script>
