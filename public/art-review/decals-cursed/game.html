<!doctype html><title>Cursed decal game QA</title><style>body{background:#17191e;color:white;font:16px system-ui}button{padding:12px;margin:5px}iframe{width:100%;height:800px;border:0}</style><h1>Cursed groundDemo review</h1><button id="demo">Show cursed groundDemo</button><button id="rotate">Rotate 90 degrees</button><p id="status">Wait for the match, then show demo.</p><iframe src="/?fight=naruto,gojo&mode=solo&art=custom&debug"></iframe><script>const frame=document.querySelector('iframe');document.querySelector('#demo').onclick=()=>{try{const w=frame.contentWindow;w.step(240);w.freezeCpu();w.step(1);const message=w.groundDemo('cursed');w.step(1);document.querySelector('#status').textContent=message+'; '+w.game.fx.ground.decals.length+' visible decal parts';}catch(e){document.querySelector('#status').textContent=e.message}};document.querySelector('#rotate').onclick=()=>{const w=frame.contentWindow;for(const d of w.game.fx.ground.decals)d.mesh.rotation.y+=Math.PI/2;w.step(1);document.querySelector('#status').textContent='Rotated '+w.game.fx.ground.decals.length+' decal parts by 90 degrees';}</script>
