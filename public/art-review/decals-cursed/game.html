<!doctype html><title>Cursed decal game QA</title><style>body{background:#17191e;color:white;font:16px system-ui}button{padding:12px;margin:5px}iframe{width:100%;height:800px;border:0}</style><h1>Cursed groundDemo review</h1><button id="demo">Show cursed groundDemo</button><button id="rotate">Rotate 90 degrees</button><p id="status">Wait for the match, then show demo.</p><iframe src="/?fight=naruto,gojo&mode=solo&debug"></iframe><script type="module">import{showReviewGroup,rotateReview}from'./review-candidates.js';const frame=document.querySelector('iframe');document.querySelector('#demo').onclick=async()=>{try{document.querySelector('#status').textContent=await showReviewGroup(frame,'cursed',['cursed']);}catch(e){document.querySelector('#status').textContent=e.message}};document.querySelector('#rotate').onclick=()=>{try{document.querySelector('#status').textContent=rotateReview(frame);}catch(e){document.querySelector('#status').textContent=e.message}};</script>
