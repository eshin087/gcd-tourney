<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unapproved chakra game review</title><style>body{margin:0;background:#171923;color:white;font:16px system-ui}header{padding:12px}button,a{margin-right:12px;padding:8px;color:inherit}button{background:#374258}iframe{border:0;width:100%;height:80vh}#status{margin-top:12px}</style><header><a href="index.html">Gallery</a><button id="load">Show 24 chakra candidates</button><button id="rotate">Rotate 90°</button><div id="status">Unapproved review harness. Wait for the match to load, then show candidates.</div></header><iframe id="game" src="/?fight=naruto,sasuke&mode=solo&debug"></iframe><script type="module">import{showReviewGroup,rotateReview}from'./review-candidates.js';const frame=document.querySelector('#game'),status=document.querySelector('#status');document.querySelector('#load').onclick=async()=>{try{const r=await showReviewGroup(frame,'chakra',['chakra']);status.textContent='Unapproved candidates loaded: '+JSON.stringify(r)}catch(e){status.textContent=e.message}};document.querySelector('#rotate').onclick=()=>{try{status.textContent=rotateReview(frame)}catch(e){status.textContent=e.message}};</script>
